//SPELREGELS
lblTitel-SRP=Rules
Stap1Titel=1. Roll the dice
Stap1Tekst=The player whose turn it is rolls the 6 dice (2 white and 4 colored).
Stap2Titel=2. The white dice (for all players)
Stap2TekstDeel1=- Add up the numbers on the two white dice.\n- The player whose turn it is gets to choose first.\n- After that, the other players may take their turns (in a set order).
Stap2Tussentitel1=Choice
Stap2TekstDeel2=- Each player may choose whether to mark this number in one of the four colored rows (yellow, green, red, blue). This is not required.
Stap2Tussentitel2=Rules for checking boxes
Stap2TekstDeel3=- The selected row must not be closed.\n- The number must not yet be checked off on your own sheet. \n- No numbers to the right of this number may already be checked.
Stap2Tussentitel3=Exception:
Stap2TekstDeel4=- The number on the far right may only be checked off if there are already at least 5 check marks in that row.
Stap3Titel=3. The colored combination (only for the player whose turn it is)
Stap3TekstDeel1=- Choose 1 colored die and 1 white die.\n- Add up the numbers on these two dice.
Stap3Tussentitel1=Required
Stap3TekstDeel2=- The player must try to mark this number in the row that corresponds to the color of the colored die.
Stap3Tussentitel2=Consequence and penalty
Stap3TekstDeel3=CAN YOU CHECK THE BOX?\n- Check the number\n- Check immediately to see if the row is closed.\n- A row ends with:\n\t at least 6 check marks, or\n\t checking the number on the far right\n- When the row closes:\n\t the dice of that color are removed from the game for everyone.\n\n\
  CAN'T CHECK THE BOX?\n- You'll get a penalty:\n\t counts as 1 failed roll\n\t +5 penalty points\n- If there are 4 penalties:\n\t the game ends.
Stap4Titel=4. Next turn
Stap4Tekst=It is the next player's turn, following the usual order.

