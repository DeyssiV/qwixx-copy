//SPELREGELS
lblTitel-SRP=Spelregels
Stap1Titel=1. Dobbelstenen werpen
Stap1Tekst=De speler die aan de beurt is, werpt de 6 dobbelstenen (2 witte en 4 gekleurde).
Stap2Titel=2. De witte dobbelstenen (voor alle spelers)
Stap2TekstDeel1=- Tel de ogen van de 2 witte dobbelstenen bij elkaar op.\n- De speler die aan de beurt is, mag als eerste kiezen.\n- Daarna mogen de andere spelers (in vaste volgorde) kiezen.
Stap2Tussentitel1=Keuze
Stap2TekstDeel2=- Elke speler mag kiezen of hij dit getal wil aankruisen in een van de vier kleurrijen (geel, groen, rood, blauw). Dit is niet verplicht.
Stap2Tussentitel2=Regels voor aankruisen (DR_KRUIS)
Stap2TekstDeel3=- De gekozen rij mag niet gesloten zijn.\n- Het getal mag nog niet aangekruist zijn op je eigen blad. \n- Er mogen geen getallen rechts van dit getal al aangekruist zijn.
Stap2Tussentitel3=Uitzondering:
Stap2TekstDeel4=- Het meest rechtse getal mag alleen aangekruist worden als er al minimaal 5 kruisjes in die rij staan.
Stap3Titel=3. De gekleurde combinatie (alleen voor de speler die aan de beurt is)
Stap3TekstDeel1=- Kies 1 gekleurde dobbelsteen en 1 witte dobbelsteen.\n- Tel de ogen van deze twee dobbelstenen bij elkaar op.
Stap3Tussentitel1=Verplicht
Stap3TekstDeel2=- De speler moet proberen dit getal aan te kruisen in de rij die overeenkomt met de kleur van de gekleurde dobbelsteen.
Stap3Tussentitel2=Gevolg en penalty
Stap3TekstDeel3=LUKT HET AANKRUISEN?\n- Kruis het getal aan\n- Controleer direct of de rij sluit (DR_SLUIT).\n- Een rij sluit bij:\n\t minimaal 6 kruisjes, of\n\t het aankruisen van het meest rechtse getal\n- Als de rij sluit:\n\t worden de dobbelstenen van deze kleur uit het spel gehaald voor iedereen.\n\n\
  LUKT HET AANKRUISEN NIET?\n- Je krijgt een penalty:\n\t telt als 1 mislukte worp\n\t +5 strafpunten\n- Bij 4 penalties:\n\t spel wordt be\u00EBindigd.
Stap4Titel=4. Volgende beurt
Stap4Tekst=De beurt gaat naar de volgende speler in de vaste volgorde.







